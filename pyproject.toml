[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mjhinge-warp"
version = "0.1.0"
description = "Batched load-dependent hinge friction for MuJoCo Warp"
requires-python = ">=3.10"
dependencies = ["mujoco==3.16.0", "mujoco-warp==3.16.0", "warp-lang==1.18.0", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mjhinge-warp = "mjhinge_warp.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/test_mjwarp_backend.py"]
pythonpath = ["python"]
